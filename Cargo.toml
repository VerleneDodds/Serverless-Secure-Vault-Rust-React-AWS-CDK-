[package]
name = "secure-storage-solution"
version = "0.1.0"
edition = "2021"

[dependencies]
aws-config = "1.1.7"
aws-sdk-dynamodb = "1.17.0"
aws-sdk-s3 = "1.17.0"
lambda_http = "0.11.1"
tokio = { version = "1", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.7", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
http = "1.1"
async-recursion = "1.1"
